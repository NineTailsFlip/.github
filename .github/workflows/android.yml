# Builds one NineTailsFlip app. Every app repository calls this from its own
# .github/workflows/build.yml:
#
#   jobs:
#     android:
#       uses: NineTailsFlip/.github/.github/workflows/android.yml@main
#       with: { app: g9 }
#       secrets: inherit
#
# - On every push and pull request: unit tests, lint, and a debug APK as a workflow artifact.
# - On a tag v<versionName> (e.g. v0.2.0): additionally a release build signed with the
#   organization's release key, published as a GitHub Release with one APK per ABI and an
#   update.json that the apps' updater (nine-core/update) reads.
name: Android

on:
  workflow_call:
    inputs:
      app:
        description: "The app's short name (tg9, g9, l9, c9, p9, m9, setup9, settings9): APK names and update.json use it."
        required: true
        type: string
      tdlib:
        description: "Build TDLib first (TG9)."
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP: ${{ inputs.app }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: TDLib cache key
        if: inputs.tdlib
        id: tdkey
        run: echo "key=tdlib-${{ runner.os }}-$(git -C third_party/td rev-parse HEAD)-${{ hashFiles('scripts/build-tdlib.sh') }}" >> "$GITHUB_OUTPUT"

      - name: TDLib cache
        if: inputs.tdlib
        id: tdcache
        uses: actions/cache@v4
        with:
          key: ${{ steps.tdkey.outputs.key }}
          path: |
            tdlib/src/main/java/org/drinkless
            tdlib/src/main/jniLibs

      - name: Build TDLib
        if: inputs.tdlib && steps.tdcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gperf ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          ANDROID_SDK_ROOT="$ANDROID_HOME" scripts/build-tdlib.sh

      - name: Tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Debug APK
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: ${{ inputs.app }}-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Check the tag against versionName
        if: env.IS_RELEASE == 'true'
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Release signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # A release signed with anything but the one release key could never update the
          # installed app, so there is no fallback to the debug key here.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::No release signing key. Run scripts/setup-release-signing.sh from NineTailsFlip/.github."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/keystore.properties

      - name: Release APKs
        if: env.IS_RELEASE == 'true'
        env:
          TG9_API_ID: ${{ secrets.TG9_API_ID }}
          TG9_API_HASH: ${{ secrets.TG9_API_HASH }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APKs
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"            # app-release, app-arm64-v8a-release, app-universal-release
            abi="${base#app-}"; abi="${abi%-release}"
            [ "$abi" = "release" ] && abi=universal
            if [ "$abi" = "universal" ]; then out="$APP-$VERSION.apk"; else out="$APP-$VERSION-$abi.apk"; fi
            cp "$apk" "dist/$out"
            echo "$abi $out" >> dist/abis.txt
          done
          ls -la dist

      - name: Publish the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "${APP^^} $VERSION" \
            --generate-notes \
            --verify-tag

      - name: update.json
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > dist/notes.md
          python3 - <<'PY'
          import hashlib, json, os
          app, version, code = os.environ["APP"], os.environ["VERSION"], int(os.environ["VERSION_CODE"])
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}"
          apks = []
          for line in open("dist/abis.txt"):
              abi, name = line.split()
              data = open(f"dist/{name}", "rb").read()
              apks.append({"abi": abi, "url": f"{base}/{name}", "size": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          info = {"app": app, "versionCode": code, "versionName": version, "notes": open("dist/notes.md").read().strip(), "apks": apks}
          json.dump(info, open("dist/update.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(info, indent=2, ensure_ascii=False))
          PY
          gh release upload "$GITHUB_REF_NAME" dist/update.json

      - name: Forget the signing key
        if: always()
        run: rm -f app/release.jks app/keystore.properties
